name: IndexNow ping

on:
  push:
    branches: [main]
    paths:
      - 'src/content/posts/**'
      - 'src/pages/**'

  workflow_dispatch:
    inputs:
      urls:
        description: 'Comma-separated URLs to submit (defaults to full sitemap)'
        required: false
        default: ''

# IndexNow is a best-effort SEO ping. A hiccup (429 rate-limit from rapid
# pushes, a deploy-window 404 on the sitemap, etc.) must never fail CI and
# page us. Every step below exits 0 and only warns.
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel to publish (60s)
        if: github.event_name == 'push'
        run: sleep 60

      - name: Discover URLs from sitemap
        id: urls
        run: |
          set -uo pipefail
          if [ -n "${{ github.event.inputs.urls }}" ]; then
            echo "urls=${{ github.event.inputs.urls }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch sitemap; if it isn't ready yet, submit nothing (non-fatal).
          if ! curl -sf https://xabier.me/sitemap-0.xml > sm.xml; then
            echo "::warning::sitemap not reachable, skipping IndexNow ping"
            echo "urls=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          urls=$(grep -oE '<loc>[^<]+</loc>' sm.xml | sed -E 's|</?loc>||g' | paste -sd ',' -)
          echo "urls=$urls" >> "$GITHUB_OUTPUT"

      - name: Ping IndexNow
        env:
          KEY: 40190ea6d02041d082d30a006aba1225
          HOST: xabier.me
          KEY_LOCATION: https://xabier.me/40190ea6d02041d082d30a006aba1225.txt
        run: |
          set -uo pipefail
          URLS_CSV='${{ steps.urls.outputs.urls }}'
          if [ -z "$URLS_CSV" ]; then
            echo "no URLs to submit"
            exit 0
          fi

          URLS_JSON=$(python3 -c "import sys,json; print(json.dumps(sys.argv[1].split(',')))" "$URLS_CSV")

          BODY=$(python3 -c "
import json,sys,os
print(json.dumps({
  'host': os.environ['HOST'],
  'key': os.environ['KEY'],
  'keyLocation': os.environ['KEY_LOCATION'],
  'urlList': json.loads(sys.argv[1]),
}))
" "$URLS_JSON")

          N=$(echo "$URLS_JSON" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "Submitting $N URLs to IndexNow..."

          CODE=$(curl -s -o resp.txt -w '%{http_code}' -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$BODY" || echo "000")

          echo "IndexNow responded HTTP $CODE"
          cat resp.txt 2>/dev/null || true
          echo

          # Best-effort: 200/202 = accepted; anything else is a non-fatal warning.
          if [ "$CODE" = "200" ] || [ "$CODE" = "202" ]; then
            echo "IndexNow accepted the submission."
          else
            echo "::warning::IndexNow returned HTTP $CODE (non-fatal, ping is best-effort)"
          fi
          exit 0
