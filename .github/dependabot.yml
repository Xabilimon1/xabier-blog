# Dependabot configuration for xabier-blog
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # npm dependencies (Astro blog + tooling)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    reviewers:
      - "Xabilimon1"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      prefix-development: "deps"
      include: "scope"
    groups:
      # Bundle patch + minor updates into a single weekly PR to reduce noise
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
      # Keep security updates in their own group so they're easy to spot and merge fast
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions (future-proof: no workflows yet, but ready when they land)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    reviewers:
      - "Xabilimon1"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
